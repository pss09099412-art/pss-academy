<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PSS아카데미">
  <meta name="theme-color" content="#2B96ED">
  <title>PSS 아카데미</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#2B96ED; }
    iframe { width:100%; height:100%; border:none; }
    .loading {
      position:fixed; top:0; left:0; width:100%; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#2B96ED; color:white; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      z-index:10; transition:opacity 0.5s;
    }
    .loading.hide { opacity:0; pointer-events:none; }
    .loading h1 { font-size:28px; font-weight:800; margin-bottom:8px; }
    .loading p { font-size:14px; opacity:0.8; }
    .loading .spinner {
      width:36px; height:36px; border:3px solid rgba(255,255,255,0.3);
      border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite;
      margin-top:24px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loadingScreen">
    <h1>PSS 아카데미</h1>
    <p>로딩 중...</p>
    <div class="spinner"></div>
  </div>

  <!--
    ⚠️ 아래 URL을 본인의 웹앱 URL로 교체하세요!
    Apps Script > 배포 > 배포관리 에서 복사한 URL
  -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbx7w4S7lNwepovCzkqZm1pYp546L-U8uvzR_ORpledO5tps8DRhScrclscReaKu5dsD/exec"
    allow="clipboard-write"
    onload="document.getElementById('loadingScreen').classList.add('hide')"
  ></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
